name: Dependency Validation

on:
  push:
  pull_request:

jobs:
  validate-dependencies:
    name: Validate Dependencies and Lockfile (Linux)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.22.2
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'

      - name: Install npm 11.19.1
        run: |
          npm install -g npm@11.19.1
          node --version
          npm --version

      - name: Verify lockfile installation (npm ci --include=dev)
        run: npm ci --include=dev

      - name: Run TypeScript validation (npx tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run test validation (npm test)
        run: npm test -- --runInBand